apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sqllab
resources:
  - manifests/namespace.yaml
  - manifests/backup-pvc.yaml
  - manifests/sqlserver-service.yaml
  - manifests/sqlserver-statefulset.yaml
  - manifests/backup-cronjob.yaml
  - manifests/networkpolicy.yaml
generatorOptions:
  # Jobs read the scripts when they start, so a stable name is easier than a hash suffix
  disableNameSuffixHash: true
configMapGenerator:
  - name: sql-scripts
    files:
      - sql/init.sql
      - sql/backup.sql
      - sql/restore-test.sql
      - sql/memory.sql
images:
  - name: mcr.microsoft.com/mssql/server
    newTag: 2022-CU19-ubuntu-22.04
