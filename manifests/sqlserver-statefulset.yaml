apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  namespace: sqllab
  labels:
    app: sqlserver
spec:
  serviceName: sqlserver-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 10001
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: sqlserver-backups
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-CU19-ubuntu-22.04
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "3072"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-sa
                  key: MSSQL_SA_PASSWORD
            # sqlcmd reads this variable, so the probe never puts the password on a command line
            - name: SQLCMDPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-sa
                  key: MSSQL_SA_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              memory: 4Gi
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  for p in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
                    if [ -x "$p" ]; then
                      exec "$p" -S localhost -U sa -C -l 3 -b -Q "SELECT 1" > /dev/null
                    fi
                  done
                  exit 1
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  for p in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
                    if [ -x "$p" ]; then
                      exec "$p" -S localhost -U sa -C -l 3 -b -Q "SELECT 1" > /dev/null
                    fi
                  done
                  exit 1
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 1433
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
            - name: backups
              mountPath: /backups
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
