# Example only. Copy to sqlserver-sa.secret.yaml (ignored by git), set a real
# password in the copy, and apply that instead. SQL Server rejects weak SA passwords:
# at least 8 characters from three of: upper case, lower case, digits, symbols.
apiVersion: v1
kind: Secret
metadata:
  name: sqlserver-sa
  namespace: sqllab
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: ChangeMe-Str0ng-Example1
